title: Suspicious Process Injection via Windows API
id: 6c2e4a8f-1d3b-5e7a-9c1d-3b5e7a9c1d3b
status: experimental
description: >
  Detects process injection patterns using common Windows API abuse.
  Adversaries inject malicious code into legitimate processes to evade
  detection and inherit the target process's privileges and trust (T1055).
  Commonly used by Cobalt Strike, Metasploit, and APT implants.
references:
  - https://attack.mitre.org/techniques/T1055/
author: Aaron Jean
date: 2026-06-13
tags:
  - attack.defense_evasion
  - attack.privilege_escalation
  - attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection_hollowing:
    Image|endswith:
      - '\explorer.exe'
      - '\svchost.exe'
      - '\notepad.exe'
      - '\rundll32.exe'
    ParentImage|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\wscript.exe'
      - '\cscript.exe'
  filter_legit_parent:
    ParentImage|contains:
      - 'C:\Windows\System32\'
      - 'C:\Windows\explorer.exe'
  condition: selection_hollowing and not filter_legit_parent
falsepositives:
  - Legitimate admin scripts launching system processes
  - Software installers spawning explorer.exe
level: high
