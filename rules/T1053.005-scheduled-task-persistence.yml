title: Scheduled Task Created via Command Line
id: 3c2e8f1a-7d4b-4a9c-b6e2-1f5c8d9e0b3a
status: experimental
description: >
  Detects scheduled task creation via schtasks.exe or at.exe from the command
  line. Adversaries use scheduled tasks for persistence and lateral movement
  (T1053.005). Baseline rule — see hardened variant for evasion coverage.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Aaron Jean
date: 2026-06-13
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\schtasks.exe'
      - '\at.exe'
    CommandLine|contains:
      - '/create'
      - '-create'
  condition: selection
falsepositives:
  - Legitimate administrative scheduled task creation
  - Software installers creating maintenance tasks
  - Windows Defender and system update tasks
level: medium
