title: LSASS Memory Dump via Known Tools
id: 8f1c3e5a-9b2d-4f6e-a7c1-3d5f7b9e1a3c
status: experimental
description: >
  Detects credential dumping from LSASS memory using common tools such as
  ProcDump, Task Manager, or direct process access. Adversaries dump LSASS
  to extract plaintext passwords, NTLM hashes, and Kerberos tickets
  (T1003.001). Observed in BlackCat, WannaCry, and APT lateral movement.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Aaron Jean
date: 2026-06-13
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_procdump:
    Image|endswith: '\procdump.exe'
    CommandLine|contains:
      - 'lsass'
      - '-ma'
  selection_taskmgr_dump:
    Image|endswith: '\taskmgr.exe'
    CommandLine|contains: 'lsass'
  selection_comsvcs:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains:
      - 'comsvcs'
      - 'MiniDump'
  condition: selection_procdump or selection_taskmgr_dump or selection_comsvcs
falsepositives:
  - Legitimate memory dumps by system administrators for debugging
  - Security tooling performing authorized credential audits
level: high
