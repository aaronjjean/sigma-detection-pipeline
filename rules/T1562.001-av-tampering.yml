title: Windows Defender Tampered or Disabled via PowerShell
id: 1a3c5e7f-9b1d-3f5a-7c9e-1b3d5f7a9c1d
status: experimental
description: >
  Detects attempts to disable Windows Defender real-time protection,
  exclusion additions, or AV service stoppage via PowerShell or sc.exe.
  Adversaries disable AV as a precursor to payload deployment (T1562.001).
  First observed step in BlackCat, LockBit, and WannaCry infections.
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: Aaron Jean
date: 2026-06-13
tags:
  - attack.defense_evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_powershell_defender:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'Set-MpPreference'
      - 'DisableRealtimeMonitoring'
      - 'DisableIOAVProtection'
      - 'DisableBehaviorMonitoring'
      - 'Add-MpPreference'
      - 'ExclusionPath'
  selection_sc_defender:
    Image|endswith: '\sc.exe'
    CommandLine|contains:
      - 'WinDefend'
      - 'stop'
      - 'delete'
  selection_reg_defender:
    Image|endswith: '\reg.exe'
    CommandLine|contains:
      - 'Windows Defender'
      - 'DisableAntiSpyware'
      - 'DisableAntiVirus'
  condition: selection_powershell_defender or selection_sc_defender or selection_reg_defender
falsepositives:
  - Security administrators configuring Defender exclusions legitimately
  - Enterprise AV management platforms
level: high
