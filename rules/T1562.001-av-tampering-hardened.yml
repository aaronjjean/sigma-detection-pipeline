title: Windows Defender Disabled - Hardened (Registry + Service Events)
id: 2b4d6f8a-0c2e-4f6b-8d0a-2c4e6f8b0d2c
status: experimental
description: >
  Hardened detection for T1562.001 combining registry modification events
  (Sysmon Event 13) targeting Defender policy keys with service stop events
  (EventID 7036) for WinDefend. Catches obfuscated PowerShell, direct
  registry edits, and process termination that bypass process-name based
  rules. Critical pre-ransomware indicator.
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: Aaron Jean
date: 2026-06-13
tags:
  - attack.defense_evasion
  - attack.t1562.001
logsource:
  category: registry_event
  product: windows
detection:
  defender_reg_tamper:
    EventType: SetValue
    TargetObject|contains:
      - '\Windows Defender\DisableAntiSpyware'
      - '\Windows Defender\DisableAntiVirus'
      - '\Windows Defender\Real-Time Protection\DisableRealtimeMonitoring'
      - '\Windows Defender\Real-Time Protection\DisableBehaviorMonitoring'
      - '\Windows Defender\Exclusions'
    Details: 'DWORD (0x00000001)'
  condition: defender_reg_tamper
falsepositives:
  - Enterprise security management platforms modifying Defender policy via GPO
  - Authorized security testing
level: critical
