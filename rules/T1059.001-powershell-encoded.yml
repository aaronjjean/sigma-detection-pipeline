title: PowerShell Encoded Command Execution
id: 7b3a9f2e-4c1d-4e8a-b5f6-2d3e7a8b9c0d
status: experimental
description: |
  Detects PowerShell execution using encoded command parameters (-EncodedCommand,
  -enc, -ec, -e). Attackers use this to pass Base64-encoded payloads that bypass
  command-line string matching and logging tools that only inspect raw arguments.
  Seen in the BlackCat and WannaCry investigations as a loader stage technique.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://lolbas-project.github.io/lolbas/Binaries/Powershell/
author: Aaron Jean
date: 2026/01/01
modified: 2026/01/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_powershell:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_encoded_flags:
    CommandLine|contains:
      - ' -EncodedCommand '
      - ' -encodedcommand '
      - ' -enc '
      - ' -ec '
      - ' -e '
  selection_base64_pattern:
    # Catch cases where the flag is omitted but a long Base64 blob is passed
    CommandLine|re: '.*\s[A-Za-z0-9+/]{50,}={0,2}\s*$'
  condition: selection_powershell and (selection_encoded_flags or selection_base64_pattern)
falsepositives:
  - Legitimate automation scripts using encoded commands (SCCM, Intune, MDM)
  - Software deployment tools that pass encoded parameters
  - Some AV/EDR products use encoded PowerShell internally
level: medium

# ---------------------------------------------------------------
# EVASION NOTE (see docs/rules/T1059.001.md for full analysis)
# ---------------------------------------------------------------
# Baseline bypass: attackers use shortened aliases (-e, -ec) or
# omit the flag entirely and pass a raw Base64 blob as a positional
# argument. The selection_base64_pattern condition catches this.
# Remaining gap: double-encoded payloads that don't end in = padding.
# Hardened variant in: rules/T1059.001-powershell-encoded-hardened.yml
