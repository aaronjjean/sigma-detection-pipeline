title: Suspicious WMI Command Execution
id: 3c5e7a9f-1b3d-5f7a-9c1e-3b5d7f9a1c3e
status: experimental
description: >
  Detects suspicious process execution via Windows Management Instrumentation
  (WMI) using wmic.exe or WmiPrvSE.exe spawning unusual child processes.
  Adversaries use WMI for fileless execution, lateral movement, and
  persistence via WMI subscriptions (T1047). Used heavily in APT campaigns
  and BlackCat pre-ransomware activity.
references:
  - https://attack.mitre.org/techniques/T1047/
author: Aaron Jean
date: 2026-06-13
tags:
  - attack.execution
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains:
      - 'process call create'
      - 'os get'
      - 'computersystem get'
      - 'shadowcopy delete'
  selection_wmiprvse_child:
    ParentImage|endswith: '\WmiPrvSE.exe'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  condition: selection_wmic or selection_wmiprvse_child
falsepositives:
  - Legitimate administrative WMI queries
  - Monitoring and inventory tools using WMIC
  - SCCM and endpoint management platforms
level: high
